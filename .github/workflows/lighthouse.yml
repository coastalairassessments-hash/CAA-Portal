name: Speed and accessibility
on:
  pull_request:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true # report-only until the scores are known
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx -y @lhci/cli@0.14.0 autorun --collect.startServerCommand="npm run dev" --collect.startServerReadyPattern="Ready" --collect.url=http://localhost:3000/ --upload.target=temporary-public-storage
