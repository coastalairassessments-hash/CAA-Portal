name: Database walls
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start a throwaway database with every migration applied
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,postgres-meta
      - name: Run the wall tests
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL" SUPABASE_ANON_KEY="$ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          DB_TESTS_REQUIRED=1 npm run test:db
